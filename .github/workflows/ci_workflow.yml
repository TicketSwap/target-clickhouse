name: Test target-clickhouse

on: [push]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version-file: .github/workflows/constraints.txt
        python-version: "3.11"
    - name: Run ruff
      run: uv run --locked ruff check .

  pytest:
    runs-on: ubuntu-latest
    services:
      clickhouse-server:
        image: clickhouse/clickhouse-server:23.4-alpine
        ports:
          - 18123:8123
          - 19000:9000
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version-file: .github/workflows/constraints.txt
        python-version: ${{ matrix.python-version }}
    - name: Test with pytest
      run: uv run --locked pytest --capture=no

  integration:
    runs-on: ubuntu-latest
    services:
      clickhouse-server:
        image: clickhouse/clickhouse-server:23.4-alpine
        ports:
          - 18123:8123
          - 19000:9000
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version-file: .github/workflows/constraints.txt
        python-version: "3.11"
    - name: Install Meltano
      run: |
        uv tool install meltano
        meltano install
    - name: smoke-test-tap
      run: meltano run tap-smoke-test target-clickhouse
