[project]
name = "shaped-target-clickhouse"
version = "0.2.5"
description = "`target-clickhouse` is a Singer target for clickhouse, built with the Meltano Singer SDK."
authors = [{ name = "Ben Theunissen" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
license = "Apache-2.0"
keywords = [
    "ELT",
    "clickhouse",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "singer-sdk>=0.54.9,<0.55",
    "clickhouse-sqlalchemy>=0.3.2,<0.4",
    "simplejson>=4.2.0,<5",
    "pendulum>=3.3.0,<4",
]

[project.optional-dependencies]
s3 = ["fs-s3fs>=1.1.1,<2"]

[project.scripts]
target-clickhouse = "target_clickhouse.target:TargetClickhouse.cli"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.17.2,<0.18",
    "singer-sdk[testing]>=0.54.9,<0.55",
    "types-simplejson>=4.2.0.20261006,<5",
    "types-setuptools>=84.0.0.20261006,<85",
    "pre-commit>=4.7.0,<5",
]

[tool.uv.build-backend]
module-name = ["target_clickhouse"]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
src = ["target_clickhouse"]

[tool.ruff.lint]
ignore = [
    "ANN001",
    "ANN201",
    "D100",
    "D101",
    "D103",
    "D401",
    "D407",
    "FA100",
    "S101",
    "G004",
    "TC002",
    "TC003",
    "ANN202",
    "C901",
    "CPY001",
    "TRY201",
    "D417",
    "ANN003",
    "FBT001",
    "FBT002",
    "UP042",
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.isort]
known-first-party = ["target_clickhouse"]

[tool.ruff.lint.pylint]
max-args = 6

[[tool.mypy.overrides]]
disable_error_code = ["name-defined"]
ignore_missing_imports = true
